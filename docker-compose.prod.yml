# Production stack for one Linux VM (D-29). See docs/DEPLOY.md.
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
# Only Caddy is reachable from outside (ports 80 and 443).
# File storage (D-38): STORAGE=bundled runs MinIO here (COMPOSE_PROFILES=bundled-storage);
# STORAGE=external uses any S3-compatible provider set in S3_* (no MinIO container).
name: cpm-prod

x-restart: &restart
  restart: unless-stopped

services:
  postgres:
    <<: *restart
    image: postgres:16.15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cpm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:-cpm}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 30

  minio:
    <<: *restart
    profiles: ["bundled-storage"]
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: ["minio", "server", "/data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-cpm-storage}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 30

  # BR-FILE-02 (D-30). Needs about 1–1.5 GB of RAM; the first start loads signatures.
  clamav:
    <<: *restart
    image: clamav/clamav:1.5.3
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 300s

  api:
    <<: *restart
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    env_file: .env.production
    environment:
      NODE_ENV: production
      API_PORT: 4000
      APP_URL: https://${APP_DOMAIN:?set APP_DOMAIN}
      TRUST_PROXY: "1" # behind Caddy: client IPs come from X-Forwarded-For
      DATABASE_URL: postgresql://${POSTGRES_USER:-cpm}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cpm}
      # Bundled MinIO unless S3_* name an external provider (D-38)
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-https://${FILES_DOMAIN:-files.invalid}}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-${MINIO_ROOT_USER:-cpm-storage}}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-${MINIO_ROOT_PASSWORD:-}}
      SCANNER: clamav
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      DEV_MARK_FILES_CLEAN: "false"
      COOKIE_SECURE: "true"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
        required: false # not started when STORAGE=external
      clamav:
        condition: service_started # uploads wait as "Scanning" until ClamAV is ready

  web:
    <<: *restart
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      FILES_DOMAIN: ${FILES_DOMAIN:-}
      # Origin of signed download links, allowed in the content-security policy
      FILES_ORIGIN: ${FILES_ORIGIN:-https://${FILES_DOMAIN:-files.invalid}}
      STORAGE: ${STORAGE:-bundled}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

volumes:
  postgres-data:
  minio-data:
  clamav-data:
  caddy-data:
  caddy-config:
