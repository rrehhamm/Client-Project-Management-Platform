# Local services for development and CI.
# Values come from .env (see .env.example).
name: cpm

services:
  postgres:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cpm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cpm_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-cpm}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Creates the cpm_test database on first start
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Official minio/minio images are no longer published publicly (2025).
  # pgsty/minio is a community build of the MinIO source. It speaks plain S3,
  # so any S3-compatible service can replace it by changing S3_* in .env.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: ["minio", "server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-cpm_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-cpm_minio_dev_secret}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.32.0
    ports:
      - "${SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
  minio-data:
