name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint, unit, API and E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Create .env from example
        run: cp .env.example .env

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Uses the same docker-compose.yml as local development
      - name: Start Postgres, MinIO and Mailpit
        run: docker compose up -d --wait

      - name: Unit and API tests
        run: npm test

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: client

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: client/playwright-report
          retention-days: 7

      - name: Service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
