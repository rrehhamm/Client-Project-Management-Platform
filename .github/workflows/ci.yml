name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint, unit, API and E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Create .env from example
        run: cp .env.example .env

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Uses the same docker-compose.yml as local development
      - name: Start Postgres, MinIO and Mailpit
        run: docker compose up -d --wait

      - name: Unit and API tests
        run: npm test

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: client

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: client/playwright-report
          retention-days: 7

      - name: Service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200

  # BR-FILE-02 / D-30: the EICAR test against a real ClamAV daemon
  virus-scanner:
    name: ClamAV EICAR check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Create .env from example
        run: cp .env.example .env

      - name: Install dependencies
        run: npm ci

      - name: Start ClamAV (loads signatures; takes a few minutes)
        run: docker compose --profile scan up -d --wait --wait-timeout 900 clamav

      - name: EICAR test
        run: npx vitest run src/lib/scanner.clamav.test.js
        working-directory: server
        env:
          CLAMAV_TEST_HOST: localhost
          CLAMAV_TEST_PORT: 3310

  # NFR-SEC-04: no secrets in the repository
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.0 git /repo --config /repo/.gitleaks.toml --redact --verbose

  # Release checklist step 3: the production images build
  images:
    name: Production images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Build API image
        run: docker build -f deploy/api.Dockerfile -t cpm-api:ci .
      - name: Build web image
        run: docker build -f deploy/web.Dockerfile -t cpm-web:ci .
      - name: Caddyfile is valid
        run: docker run --rm -e APP_DOMAIN=app.example.com -e FILES_DOMAIN=files.example.com -e ACME_EMAIL=ops@example.com cpm-web:ci caddy validate --config /etc/caddy/Caddyfile
